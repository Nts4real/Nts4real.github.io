<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Cream paper background -->
  <rect width="32" height="32" rx="3" fill="#F4EFE6"/>
  <!-- Subtle border ring -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="3" fill="none" stroke="#0E1116" stroke-width="1"/>
  <!-- Monogram: N in ink, S in sienna italic -->
  <text x="7" y="23" font-family="Georgia, 'Fraunces', serif" font-size="18" font-weight="700" fill="#0E1116">N</text>
  <text x="17" y="23" font-family="Georgia, 'Fraunces', serif" font-size="18" font-weight="600" font-style="italic" fill="#B8470F">S</text>
</svg>
